<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">Research Atlas domain workflows</title>
  <desc id="desc">Two configurable research workflows share the same multi-agent orchestration and end with evidence review and a report.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f7ff"/><stop offset="1" stop-color="#f8fbf9"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#93a0b4"/></marker></defs>
  <rect width="1600" height="780" rx="26" fill="url(#bg)"/><text x="64" y="72" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#3159d9">RESEARCH ATLAS · DOMAIN WORKFLOWS</text><text x="64" y="126" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750" fill="#18253b">Different scientific domains, one traceable workflow pattern</text>
  <text x="64" y="213" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#3159d9">SMALL-MOLECULE DRUG DISCOVERY</text>
  <text x="64" y="506" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#26805e">DRUG–DRUG COCRYSTAL DEVELOPMENT</text>
  <g font-family="Inter,Arial,sans-serif" fill="#233552">
    <g><rect x="64" y="239" width="190" height="96" rx="14" fill="#fff" stroke="#dce3ee"/><text x="159" y="276" text-anchor="middle" font-size="14" font-weight="700">Target &amp; site</text><text x="159" y="302" text-anchor="middle" font-size="12" fill="#718099">Structure review</text></g>
    <g><rect x="286" y="239" width="190" height="96" rx="14" fill="#fff" stroke="#dce3ee"/><text x="381" y="276" text-anchor="middle" font-size="14" font-weight="700">Candidate triage</text><text x="381" y="302" text-anchor="middle" font-size="12" fill="#718099">Screen &amp; optimize</text></g>
    <g><rect x="508" y="239" width="190" height="96" rx="14" fill="#fff" stroke="#dce3ee"/><text x="603" y="276" text-anchor="middle" font-size="14" font-weight="700">Property &amp; binding</text><text x="603" y="302" text-anchor="middle" font-size="12" fill="#718099">Assess evidence</text></g>
    <g><rect x="730" y="239" width="190" height="96" rx="14" fill="#fff" stroke="#dce3ee"/><text x="825" y="276" text-anchor="middle" font-size="14" font-weight="700">Synthesis review</text><text x="825" y="302" text-anchor="middle" font-size="12" fill="#718099">Route search</text></g>
    <g><rect x="952" y="239" width="190" height="96" rx="14" fill="#fff" stroke="#dce3ee"/><text x="1047" y="276" text-anchor="middle" font-size="14" font-weight="700">Evidence review</text><text x="1047" y="302" text-anchor="middle" font-size="12" fill="#718099">Gaps &amp; validation</text></g>
    <g><rect x="1174" y="239" width="190" height="96" rx="14" fill="#eaf0ff" stroke="#cdd8f5"/><text x="1269" y="276" text-anchor="middle" font-size="14" font-weight="700">Researcher review</text><text x="1269" y="302" text-anchor="middle" font-size="12" fill="#526582">Report &amp; next steps</text></g>
    <g><rect x="64" y="532" width="190" height="96" rx="14" fill="#fff" stroke="#dce3ee"/><text x="159" y="569" text-anchor="middle" font-size="14" font-weight="700">Model drug</text><text x="159" y="595" text-anchor="middle" font-size="12" fill="#718099">Objective &amp; dose</text></g>
    <g><rect x="286" y="532" width="190" height="96" rx="14" fill="#fff" stroke="#dce3ee"/><text x="381" y="569" text-anchor="middle" font-size="14" font-weight="700">Counterpart selection</text><text x="381" y="595" text-anchor="middle" font-size="12" fill="#718099">Pair evidence</text></g>
    <g><rect x="508" y="532" width="190" height="96" rx="14" fill="#fff" stroke="#dce3ee"/><text x="603" y="569" text-anchor="middle" font-size="14" font-weight="700">Concept screening</text><text x="603" y="595" text-anchor="middle" font-size="12" fill="#718099">Chemical complementarity</text></g>
    <g><rect x="730" y="532" width="190" height="96" rx="14" fill="#fff" stroke="#dce3ee"/><text x="825" y="569" text-anchor="middle" font-size="14" font-weight="700">Virtual &amp; thermal</text><text x="825" y="595" text-anchor="middle" font-size="12" fill="#718099">Models + measurements</text></g>
    <g><rect x="952" y="532" width="190" height="96" rx="14" fill="#fff" stroke="#dce3ee"/><text x="1047" y="569" text-anchor="middle" font-size="14" font-weight="700">Prepare &amp; evaluate</text><text x="1047" y="595" text-anchor="middle" font-size="12" fill="#718099">Solid-state evidence</text></g>
    <g><rect x="1174" y="532" width="190" height="96" rx="14" fill="#eaf6ef" stroke="#cce6d8"/><text x="1269" y="569" text-anchor="middle" font-size="14" font-weight="700">Researcher review</text><text x="1269" y="595" text-anchor="middle" font-size="12" fill="#526582">Report &amp; next steps</text></g>
  </g>
