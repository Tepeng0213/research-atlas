  <rect x="98" y="262" width="244" height="102" rx="14" fill="#eef2ff"/><text x="120" y="300" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#233552">Drug discovery</text><text x="120" y="328" font-family="Inter,Arial,sans-serif" font-size="13" fill="#65758d">Stages · roles · tool bindings</text>
  <rect x="98" y="382" width="244" height="102" rx="14" fill="#e9f6ef"/><text x="120" y="420" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#233552">Drug–drug cocrystals</text><text x="120" y="448" font-family="Inter,Arial,sans-serif" font-size="13" fill="#65758d">Stages · roles · tool bindings</text>
