  <rect x="1098" y="418" width="244" height="62" rx="13" fill="#f4f6fc"/><text x="1120" y="456" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650" fill="#233552">Docking &amp; retrosynthesis</text>
