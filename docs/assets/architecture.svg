  <text x="440" y="235" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#3159d9">SHARED MULTI-AGENT RUNTIME</text>
  <rect x="442" y="260" width="556" height="70" rx="15" fill="#24334e"/><text x="720" y="303" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">Workflow Orchestrator</text>
