<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Research Atlas platform architecture</title>
  <desc id="desc">Domain packs feed a shared multi-agent workflow runtime, which calls scientific adapters and produces reviewable evidence and reports.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f3f6ff"/><stop offset="1" stop-color="#f8fbfa"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d3150" flood-opacity=".08"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8c9bb1"/></marker></defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/><text x="72" y="78" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#3159d9">RESEARCH ATLAS · PLATFORM DESIGN</text><text x="72" y="132" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750" fill="#18253b">One reusable runtime. Configurable scientific workflows.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="190" width="300" height="450" rx="22" fill="#fff" stroke="#dce3ee"/><rect x="405" y="190" width="630" height="450" rx="22" fill="#fff" stroke="#cbd7f2"/><rect x="1070" y="190" width="300" height="450" rx="22" fill="#fff" stroke="#dce3ee"/>
  </g>
