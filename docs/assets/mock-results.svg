<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative mock screening results</title>
  <desc id="desc">A fictional user-interface preview showing candidate rows and placeholder scores; values are not computed or scientifically meaningful.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f7ff"/><stop offset="1" stop-color="#f9fbfa"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d3150" flood-opacity=".07"/></filter></defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/><text x="66" y="75" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.8" fill="#3159d9">ILLUSTRATIVE UI PREVIEW · FICTIONAL VALUES</text><text x="66" y="128" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750" fill="#18253b">A result view built for review—not just ranking</text>
  <g filter="url(#shadow)"><rect x="64" y="174" width="1312" height="500" rx="22" fill="#fff" stroke="#dce3ee"/></g>
  <rect x="92" y="202" width="1256" height="74" rx="15" fill="#fff8e7" stroke="#f0dfb4"/><circle cx="123" cy="239" r="14" fill="#e7c66a"/><text x="123" y="244" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#604b1c">!</text><text x="151" y="234" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="750" fill="#493d23">SIMULATED DEMO DATA — no scientific calculation was run.</text><text x="151" y="256" font-family="Inter,Arial,sans-serif" font-size="12" fill="#776744">Candidate labels and values below are fictional placeholders used only to illustrate the interface.</text>
  <text x="104" y="322" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.3" fill="#75839a">MOCK CANDIDATE SUMMARY</text><text x="1330" y="322" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#75839a">Illustrative scale only</text>
  <rect x="96" y="342" width="1248" height="42" rx="8" fill="#f2f5fa"/><g font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#65758d"><text x="116" y="368">Candidate</text><text x="366" y="368">MW</text><text x="518" y="368">cLogP</text><text x="670" y="368">QED</text><text x="848" y="368">Vina-like score*</text><text x="1130" y="368">Review state</text></g>
  <g font-family="Inter,Arial,sans-serif" font-size="15" fill="#233552"><text x="116" y="425" font-weight="700">Demo candidate A</text><text x="366" y="425">342.4</text><text x="518" y="425">2.1</text><text x="670" y="425">0.74</text><text x="848" y="425">−8.2</text><text x="1130" y="425" fill="#99721f">Needs evidence</text>
  <text x="116" y="493" font-weight="700">Demo candidate B</text><text x="366" y="493">298.3</text><text x="518" y="493">1.7</text><text x="670" y="493">0.69</text><text x="848" y="493">−7.6</text><text x="1130" y="493" fill="#99721f">Needs evidence</text>
  <text x="116" y="561" font-weight="700">Demo candidate C</text><text x="366" y="561">376.5</text><text x="518" y="561">3.0</text><text x="670" y="561">0.61</text><text x="848" y="561">−6.9</text><text x="1130" y="561" fill="#99721f">Needs evidence</text></g>
  <g stroke="#e7ebf2"><path d="M96 450h1248"/><path d="M96 518h1248"/><path d="M96 586h1248"/></g>
  <rect x="96" y="614" width="1248" height="34" rx="9" fill="#f4f6fc"/><text x="116" y="636" font-family="Inter,Arial,sans-serif" font-size="11" fill="#65758d">* Placeholder score for visual design only. Real docking scores require prepared structures and cannot establish binding affinity or activity.</text>
  <text x="66" y="716" font-family="Inter,Arial,sans-serif" font-size="12" fill="#718099">UI concept only · The production workbench displays provenance, missing inputs, scientific artifacts, and method-specific limitations.</text>
</svg>
