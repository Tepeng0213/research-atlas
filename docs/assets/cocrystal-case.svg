<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">Drug-drug cocrystal screening, preparation, and evidence workflow mockup</title>
  <desc id="desc">An explicitly simulated interface showing drug-pair evidence, conceptual and virtual screening boundaries, thermal-analysis inputs, crystallization planning, and PXRD confirmation requirements. Schematic plots are not experimental data.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f2f7ff"/><stop offset="1" stop-color="#f7fbf8"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d3150" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8c9bb1"/></marker></defs>
  <rect width="1800" height="1320" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.6" fill="#26805e">DRUG–DRUG COCRYSTAL DEVELOPMENT · WORKFLOW PREVIEW</text>
  <text x="64" y="124" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="750" fill="#18253b">Screen a drug pair, plan experiments, review solid-state evidence</text>
  <rect x="64" y="152" width="1672" height="76" rx="15" fill="#fff8e7" stroke="#f0dfb4"/><text x="92" y="183" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="750" fill="#493d23">SIMULATED CASE · FICTIONAL DRUG A + DRUG B · NO PAIRING CALCULATION OR EXPERIMENT WAS RUN</text><text x="92" y="207" font-family="Inter,Arial,sans-serif" font-size="12" fill="#776744">This preview shows the platform’s output structure. It deliberately makes no claim that the pair forms a cocrystal or has therapeutic benefit.</text>
  <text x="64" y="276" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#65758d">COUNTERPART SELECTION → COMPUTATIONAL SCREENING → THERMAL SCREENING → PREPARATION → EVALUATION</text>
  <g filter="url(#shadow)"><rect x="64" y="300" width="518" height="190" rx="18" fill="#fff" stroke="#dce3ee"/><rect x="640" y="300" width="518" height="190" rx="18" fill="#fff" stroke="#dce3ee"/><rect x="1216" y="300" width="520" height="190" rx="18" fill="#fff" stroke="#dce3ee"/></g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="92" y="340" font-size="12" font-weight="700" letter-spacing="1" fill="#26805e">01 · PAIR SELECTION</text><text x="92" y="377" font-size="20" font-weight="750" fill="#233552">Model drug + counterpart</text><text x="92" y="410" font-size="13" fill="#42536d">Structure / dose / molar ratio</text><text x="92" y="437" font-size="13" fill="#42536d">Combination-therapy evidence</text><text x="92" y="464" font-size="12" fill="#99721f">PK compatibility and interactions need evidence</text>
    <text x="668" y="340" font-size="12" font-weight="700" letter-spacing="1" fill="#26805e">02 · CONCEPT &amp; VIRTUAL SCREEN</text><text x="668" y="377" font-size="20" font-weight="750" fill="#233552">Complementarity ≠ probability</text><text x="668" y="410" font-size="13" fill="#42536d">RDKit donor / acceptor counts</text><text x="668" y="437" font-size="13" fill="#42536d">Empirical ΔpKa from supplied values</text><text x="668" y="464" font-size="12" fill="#99721f">No calibrated formation model → no probability</text>
    <text x="1244" y="340" font-size="12" font-weight="700" letter-spacing="1" fill="#26805e">03 · THERMAL SCREEN</text><text x="1244" y="377" font-size="20" font-weight="750" fill="#233552">DSC / TGA data review</text><text x="1244" y="410" font-size="13" fill="#42536d">Find peaks and mass-change regions</text><text x="1244" y="437" font-size="13" fill="#42536d">Ideal binary baseline if parameters exist</text><text x="1244" y="464" font-size="12" fill="#99721f">Baseline does not prove a new solid phase</text>
    <text x="92" y="557" font-size="12" font-weight="700" letter-spacing="1" fill="#26805e">04 · CRYSTALLIZATION PLAN</text><text x="92" y="594" font-size="20" font-weight="750" fill="#233552">Methods + experimental controls</text><text x="92" y="627" font-size="13" fill="#42536d">Neat grinding · liquid-assisted grinding</text><text x="92" y="654" font-size="13" fill="#42536d">Slurry / evaporation as cross-checks</text><text x="92" y="681" font-size="12" fill="#99721f">No unvalidated temperatures, times, or solvent amounts</text>
    <text x="668" y="557" font-size="12" font-weight="700" letter-spacing="1" fill="#26805e">05 · SOLID-STATE EVALUATION</text><text x="668" y="594" font-size="20" font-weight="750" fill="#233552">PXRD peak comparison</text><text x="668" y="627" font-size="13" fill="#42536d">Product peaks vs supplied references</text><text x="668" y="654" font-size="13" fill="#42536d">Mixture fit and unmatched-peak review</text><text x="668" y="681" font-size="12" fill="#99721f">PXRD alone cannot confirm identity or purity</text>
    <text x="1244" y="557" font-size="12" font-weight="700" letter-spacing="1" fill="#26805e">06 · RESEARCHER DECISION</text><text x="1244" y="594" font-size="20" font-weight="750" fill="#233552">Evidence report &amp; next step</text><text x="1244" y="627" font-size="13" fill="#42536d">Surface missing data and assumptions</text><text x="1244" y="654" font-size="13" fill="#42536d">Plan orthogonal characterization</text><text x="1244" y="681" font-size="12" fill="#99721f">A new phase is not a new drug or benefit claim</text>
  </g>
  <g fill="none" stroke="#8c9bb1" stroke-width="2" marker-end="url(#arrow)"><path d="M582 395h48"/><path d="M1158 395h48"/><path d="M582 650h48"/><path d="M1158 650h48"/></g>
  <g filter="url(#shadow)"><rect x="64" y="740" width="700" height="460" rx="18" fill="#fff" stroke="#dce3ee"/><rect x="790" y="740" width="946" height="460" rx="18" fill="#fff" stroke="#dce3ee"/></g>
  <text x="94" y="782" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="750" fill="#233552">Illustrative pair decision panel</text><text x="94" y="810" font-family="Inter,Arial,sans-serif" font-size="12" fill="#65758d">What an honest screening result can report when evidence is incomplete</text>
  <g font-family="Inter,Arial,sans-serif"><rect x="94" y="835" width="640" height="52" rx="11" fill="#f3f6fb"/><text x="112" y="857" font-size="11" fill="#65758d">PAIR</text><text x="112" y="877" font-size="14" font-weight="700" fill="#233552">Fictional model drug A + candidate drug B</text>
    <text x="112" y="923" font-size="13" fill="#526582">Combination / PK evidence</text><text x="690" y="923" text-anchor="end" font-size="13" font-weight="700" fill="#99721f">Not supplied</text><path d="M112 937h596" stroke="#e7ebf2"/>
    <text x="112" y="965" font-size="13" fill="#526582">Structure / pKa inputs</text><text x="690" y="965" text-anchor="end" font-size="13" font-weight="700" fill="#99721f">Required for screen</text><path d="M112 979h596" stroke="#e7ebf2"/>
    <text x="112" y="1007" font-size="13" fill="#526582">Formation probability</text><text x="690" y="1007" text-anchor="end" font-size="13" font-weight="700" fill="#8d4a40">Not generated</text><path d="M112 1021h596" stroke="#e7ebf2"/>
    <text x="112" y="1049" font-size="13" fill="#526582">DSC / TGA / PXRD</text><text x="690" y="1049" text-anchor="end" font-size="13" font-weight="700" fill="#99721f">Measured files required</text>
    <rect x="94" y="1070" width="640" height="91" rx="12" fill="#fff8e7"/><text x="116" y="1102" font-size="12" font-weight="750" fill="#493d23">CURRENT STATUS · HOLD FOR INPUTS</text><text x="116" y="1128" font-size="12" fill="#776744">No cocrystal formation, therapeutic benefit, or new phase is claimed.</text><text x="116" y="1148" font-size="12" fill="#776744">Next: verify pair evidence, provide structures / pKa, then analyze measured data.</text></g>
  <text x="820" y="782" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="750" fill="#233552">Expected data views · schematic traces only</text><text x="820" y="810" font-family="Inter,Arial,sans-serif" font-size="12" fill="#65758d">Illustrations show the shape of measured inputs; no experiment was run for this mock pair.</text>
  <g><rect x="818" y="835" width="420" height="300" rx="14" fill="#fbfcfe" stroke="#e3e8f0"/><text x="844" y="868" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#233552">DSC · heat flow vs temperature</text><path d="M866 1085h322M866 1085V895" fill="none" stroke="#a8b4c5" stroke-width="1.5"/><path d="M870 1030 C916 1024 935 1026 962 1028 C980 1029 988 1000 1000 954 C1010 918 1021 1002 1034 1023 C1050 1044 1070 1035 1080 1013 C1092 987 1100 1012 1110 1030 C1130 1051 1155 1034 1185 1033" fill="none" stroke="#3159d9" stroke-width="4"/><path d="M1004 936v135" stroke="#c7d1df" stroke-dasharray="5 5"/><text x="1004" y="920" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#65758d">schematic peak</text><text x="1026" y="1110" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#65758d">TEMPERATURE →</text><text x="839" y="1002" transform="rotate(-90 839 1002)" font-family="Inter,Arial,sans-serif" font-size="10" fill="#65758d">HEAT FLOW</text><rect x="844" y="1144" width="150" height="23" rx="11" fill="#fff0ed"/><text x="919" y="1160" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#8d4a40">SCHEMATIC ONLY</text>
  <rect x="1260" y="835" width="446" height="300" rx="14" fill="#fbfcfe" stroke="#e3e8f0"/><text x="1286" y="868" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#233552">PXRD · intensity vs 2θ</text><path d="M1300 1085h372M1300 1085V895" fill="none" stroke="#a8b4c5" stroke-width="1.5"/><path d="M1304 1062 L1320 1060 L1331 1010 L1340 1061 L1363 1058 L1382 1034 L1390 1060 L1424 1061 L1434 962 L1443 1060 L1470 1058 L1484 1023 L1492 1060 L1522 1061 L1541 992 L1550 1060 L1578 1059 L1591 1028 L1600 1060 L1630 1061 L1641 1004 L1652 1060 L1668 1059" fill="none" stroke="#26805e" stroke-width="3.5"/><path d="M1434 934v135M1541 965v104" stroke="#c7d1df" stroke-dasharray="5 5"/><text x="1450" y="920" font-family="Inter,Arial,sans-serif" font-size="10" fill="#65758d">peaks need references</text><text x="1486" y="1110" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#65758d">2θ →</text><text x="1273" y="1002" transform="rotate(-90 1273 1002)" font-family="Inter,Arial,sans-serif" font-size="10" fill="#65758d">INTENSITY</text><rect x="1286" y="1144" width="150" height="23" rx="11" fill="#fff0ed"/><text x="1361" y="1160" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#8d4a40">SCHEMATIC ONLY</text></g>
  <rect x="64" y="1220" width="1672" height="54" rx="14" fill="#24334e"/><text x="900" y="1254" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#fff">The platform distinguishes calculated heuristics, optional model scores, measured thermal / diffraction data, and confirmed solid-form evidence.</text>
</svg>
