<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
  <title id="title">ABL kinase reference workflow from binding site to candidate assessment and retrosynthesis</title>
  <desc id="desc">A real reference-ligand example using PDB 1IEP and imatinib, with calculated molecular descriptors, a local Vina score, and an AiZynthFinder route-search summary showing that no complete historical-stock route was found.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f2f6ff"/><stop offset="1" stop-color="#f7fbf8"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d3150" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8c9bb1"/></marker></defs>
  <rect width="1800" height="1240" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.6" fill="#3159d9">SMALL-MOLECULE DISCOVERY · REFERENCE CASE</text>
  <text x="64" y="124" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="750" fill="#18253b">From a protein pocket to ligand assessment and route review</text>
  <rect x="64" y="152" width="1672" height="76" rx="15" fill="#fff8e7" stroke="#f0dfb4"/>
  <text x="92" y="183" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="750" fill="#493d23">REFERENCE-LIGAND BENCHMARK — NOT A NEW DRUG DISCOVERY RESULT</text>
  <text x="92" y="207" font-family="Inter,Arial,sans-serif" font-size="12" fill="#776744">PDB 1IEP is a known c-Abl kinase complex with STI-571 (imatinib). The workflow below illustrates available stages and a local reference-ligand score.</text>
  <text x="64" y="275" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#65758d">TARGET → SITE → CANDIDATES → DOCKING → RETROSYNTHESIS</text>
  <g filter="url(#shadow)"><rect x="64" y="296" width="388" height="250" rx="18" fill="#fff" stroke="#dce3ee"/><rect x="493" y="296" width="388" height="250" rx="18" fill="#fff" stroke="#dce3ee"/><rect x="922" y="296" width="388" height="250" rx="18" fill="#fff" stroke="#dce3ee"/><rect x="1351" y="296" width="385" height="250" rx="18" fill="#fff" stroke="#dce3ee"/></g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="92" y="336" font-size="12" font-weight="700" letter-spacing="1" fill="#3159d9">01 · INPUT STRUCTURE</text><text x="92" y="374" font-size="21" font-weight="750" fill="#233552">ABL kinase · PDB 1IEP</text><text x="92" y="402" font-size="14" fill="#65758d">X-ray structure · 2.10 Å</text><text x="92" y="438" font-size="13" fill="#42536d">Reference ligand: STI-571 / imatinib</text><text x="92" y="465" font-size="13" fill="#42536d">Known ATP-binding-site complex</text><rect x="92" y="490" width="164" height="27" rx="13" fill="#e7f5ef"/><text x="174" y="508" text-anchor="middle" font-size="11" font-weight="700" fill="#207a58">STRUCTURE INPUT</text>
    <text x="521" y="336" font-size="12" font-weight="700" letter-spacing="1" fill="#3159d9">02 · BINDING-SITE SETUP</text><text x="521" y="374" font-size="20" font-weight="750" fill="#233552">Define a usable pocket</text><text x="521" y="410" font-size="13" fill="#42536d">• Inspect chains and residue gaps</text><text x="521" y="438" font-size="13" fill="#42536d">• Use supplied site residues or center</text><text x="521" y="466" font-size="13" fill="#42536d">• Prepare receptor PDBQT for docking</text><text x="521" y="500" font-size="12" fill="#99721f">Protonation, cofactors, and box need review</text>
    <text x="950" y="336" font-size="12" font-weight="700" letter-spacing="1" fill="#3159d9">03 · CANDIDATE TRIAGE</text><text x="950" y="374" font-size="20" font-weight="750" fill="#233552">Library → ranked evidence</text><text x="950" y="410" font-size="13" fill="#42536d">• User SMI / SDF / CSV library</text><text x="950" y="438" font-size="13" fill="#42536d">• Optional target-linked ChEMBL lookup</text><text x="950" y="466" font-size="13" fill="#42536d">• RDKit descriptors, QED, similarity</text><text x="950" y="500" font-size="12" fill="#99721f">Activity needs comparable assay evidence</text>
    <text x="1379" y="336" font-size="12" font-weight="700" letter-spacing="1" fill="#3159d9">04 · DOCKING &amp; ROUTE</text><text x="1379" y="374" font-size="20" font-weight="750" fill="#233552">Two distinct calculations</text><text x="1379" y="410" font-size="13" fill="#42536d">AutoDock Vina: scores &amp; poses</text><text x="1379" y="438" font-size="13" fill="#42536d">AiZynthFinder: route trees &amp; stock</text><text x="1379" y="466" font-size="13" fill="#42536d">Track artifacts and open requirements</text><text x="1379" y="500" font-size="12" fill="#99721f">Conditions, yields &amp; live supply not inferred</text>
  </g>
  <g fill="none" stroke="#8c9bb1" stroke-width="2" marker-end="url(#arrow)"><path d="M452 420h32"/><path d="M881 420h32"/><path d="M1310 420h32"/></g>
  <text x="64" y="603" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#65758d">REFERENCE-LIGAND OUTPUT SNAPSHOT · CALCULATED LOCALLY FOR THIS PORTFOLIO EXAMPLE</text>
  <g filter="url(#shadow)"><rect x="64" y="626" width="790" height="350" rx="18" fill="#fff" stroke="#dce3ee"/><rect x="886" y="626" width="850" height="350" rx="18" fill="#fff" stroke="#dce3ee"/></g>
  <text x="94" y="670" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="750" fill="#233552">Known ligand · imatinib (STI)</text><text x="94" y="697" font-family="Inter,Arial,sans-serif" font-size="12" fill="#65758d">RDKit 2023.09.6 descriptors from the PDB 1IEP ligand SDF</text>
  <g font-family="Inter,Arial,sans-serif"><rect x="94" y="724" width="220" height="74" rx="12" fill="#f3f6fb"/><text x="114" y="753" font-size="11" fill="#65758d">MOLECULAR WEIGHT</text><text x="114" y="781" font-size="22" font-weight="750" fill="#233552">494.6 g/mol</text><rect x="331" y="724" width="220" height="74" rx="12" fill="#f3f6fb"/><text x="351" y="753" font-size="11" fill="#65758d">cLogP · TPSA</text><text x="351" y="781" font-size="22" font-weight="750" fill="#233552">3.17 · 87.5 Å²</text><rect x="568" y="724" width="250" height="74" rx="12" fill="#f3f6fb"/><text x="588" y="753" font-size="11" fill="#65758d">QED · HBD / HBA</text><text x="588" y="781" font-size="22" font-weight="750" fill="#233552">0.366 · 3 / 6</text>
  <rect x="94" y="819" width="724" height="112" rx="14" fill="#eef2ff"/><text x="118" y="854" font-size="12" font-weight="700" letter-spacing="1" fill="#3159d9">VINA LOCAL-SEARCH SCORE · REFERENCE LIGAND</text><text x="118" y="904" font-size="38" font-weight="800" fill="#233552">−13.235 <tspan font-size="18" font-weight="650">kcal/mol</tspan></text><text x="492" y="878" font-size="12" fill="#526582">Prepared ligand · 26 Å box · seed 2026</text><text x="492" y="901" font-size="12" fill="#526582">Score-only context; not measured affinity.</text></g>
  <text x="916" y="670" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="750" fill="#233552">Retrosynthesis search · actual model output</text><text x="916" y="697" font-family="Inter,Arial,sans-serif" font-size="12" fill="#65758d">AiZynthFinder · USPTO policy · historical ZINC stock · 40-iteration search</text>
  <g font-family="Inter,Arial,sans-serif"><rect x="916" y="724" width="235" height="84" rx="12" fill="#f3f6fb"/><text x="936" y="753" font-size="11" fill="#65758d">ROUTE PROPOSALS</text><text x="936" y="786" font-size="26" font-weight="750" fill="#233552">40</text><rect x="1167" y="724" width="235" height="84" rx="12" fill="#fff0ed"/><text x="1187" y="753" font-size="11" fill="#8d4a40">STOCK-COMPLETE ROUTES</text><text x="1187" y="786" font-size="26" font-weight="750" fill="#8d4a40">0</text><rect x="1418" y="724" width="286" height="84" rx="12" fill="#fff8e7"/><text x="1438" y="753" font-size="11" fill="#776744">TOP ROUTE PRECURSORS IN STOCK</text><text x="1438" y="786" font-size="26" font-weight="750" fill="#493d23">4 / 5</text>
  <text x="916" y="851" font-size="12" font-weight="700" letter-spacing="1" fill="#65758d">ROUTE TREE STATUS</text><rect x="916" y="869" width="236" height="54" rx="11" fill="#24334e"/><text x="1034" y="902" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Imatinib target</text><path d="M1152 896h30M1182 896v-20h24M1182 896v20h24" fill="none" stroke="#8c9bb1" stroke-width="2"/><rect x="1208" y="855" width="210" height="44" rx="10" fill="#f3f6fb"/><text x="1313" y="883" text-anchor="middle" font-size="12" font-weight="650" fill="#233552">Route branch · stock hits</text><rect x="1208" y="905" width="210" height="40" rx="10" fill="#fff0ed"/><text x="1313" y="930" text-anchor="middle" font-size="12" font-weight="700" fill="#8d4a40">One precursor missing</text><text x="1440" y="882" font-size="12" fill="#526582">Search output is a route proposal,</text><text x="1440" y="905" font-size="12" fill="#526582">not a validated synthesis protocol.</text></g>
  <rect x="64" y="1001" width="1672" height="144" rx="18" fill="#24334e"/><text x="94" y="1044" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="750" fill="#fff">WHAT THE PLATFORM ADDS</text><text x="94" y="1075" font-family="Inter,Arial,sans-serif" font-size="14" fill="#e0e7f3">Structure provenance → binding-site definition → compound triage → docking artifacts → route search → stock-gap review → researcher decision.</text><text x="94" y="1111" font-family="Inter,Arial,sans-serif" font-size="12" fill="#c2cde0">Limits: this is a known co-crystal ligand benchmark, not a prospective hit. Docking scores are not affinity; historical stock is not live availability; route conditions, yields, selectivity, and safety require expert review.</text>
  <text x="64" y="1194" font-family="Inter,Arial,sans-serif" font-size="12" fill="#718099">Sources: <tspan fill="#3159d9">RCSB PDB 1IEP</tspan> · AutoDock Vina 1.2.7 · AiZynthFinder public USPTO model / historical ZINC asset</text>
</svg>
